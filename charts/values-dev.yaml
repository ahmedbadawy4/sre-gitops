image:
  repository: ghcr.io/ahmedbadawy4/sre-gitops
  tag: "main"

replicaCount: 1
environment: "dev"
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: web-app-dev.local
      path: /
  tls: []

resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 100m
    memory: 96Mi
