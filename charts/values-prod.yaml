image:
  repository: ghcr.io/ahmedbadawy4/sre-gitops
  tag: "v0.0.2"

replicaCount: 2
environment: "prod"
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: web-app-prod.local
      path: /
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi
