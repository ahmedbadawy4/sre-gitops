apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-gitops-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/ahmedbadawy4/sre-gitops.git"
    targetRevision: "main"
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
