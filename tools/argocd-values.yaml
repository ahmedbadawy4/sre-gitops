# Minimal values; override as needed.
configs:
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, admin, role:admin
server:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - argocd.local
    tls:
      - hosts:
          - argocd.local
