name: Release (Prod Tag Update)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  update-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set prod image tag from git tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PROD_FILE="charts/values-prod.yaml"
          if [[ ! -f "$PROD_FILE" ]]; then
            echo "missing file: $PROD_FILE" >&2
            exit 1
          fi
          sed -i.bak -E "s/(tag:[[:space:]]*)\"?[^\"[:space:]]+\"?/\\1\"${TAG}\"/" "$PROD_FILE"
          rm -f "${PROD_FILE}.bak"
          echo "updated $PROD_FILE to tag ${TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add charts/values-prod.yaml
          git commit -m "chore: bump image tag to ${GITHUB_REF_NAME}" || exit 0
          git push
