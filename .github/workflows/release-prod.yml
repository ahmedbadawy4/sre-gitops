name: Release (Prod Tag Update)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  update-values:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (tag)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      # - name: Set kubeconfig (placeholder)
      #   run: |
      #     echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
      #   env:
      #     KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      #
      # - name: Apply app-of-apps (placeholder)
      #   run: kubectl --kubeconfig kubeconfig apply -n argocd -f deploy/argocd/applications.yaml

      - name: Bump prod image tag and push
        run: |
          TAG="${GITHUB_REF_NAME}"
          PROD_FILE="charts/values-prod.yaml"
          BRANCH="${{ github.event.repository.default_branch }}"
          if [[ ! -f "$PROD_FILE" ]]; then
            echo "missing file: $PROD_FILE" >&2
            exit 1
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          sed -i.bak -E "s/(tag:[[:space:]]*)\"?[^\"[:space:]]+\"?/\\1\"${TAG}\"/" "$PROD_FILE"
          rm -f "${PROD_FILE}.bak"
          echo "updated $PROD_FILE to tag ${TAG}"
          git add "$PROD_FILE"
          git commit -m "chore: bump image tag to ${TAG}" || exit 0
          git push origin "$BRANCH"
