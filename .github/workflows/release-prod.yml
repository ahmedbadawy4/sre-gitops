name: Release (Prod Tag Update)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  update-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (tag)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Set prod image tag from git tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PROD_FILE="charts/values-prod.yaml"
          if [[ ! -f "$PROD_FILE" ]]; then
            echo "missing file: $PROD_FILE" >&2
            exit 1
          fi
          sed -i.bak -E "s/(tag:[[:space:]]*)\"?[^\"[:space:]]+\"?/\\1\"${TAG}\"/" "$PROD_FILE"
          rm -f "${PROD_FILE}.bak"
          echo "updated $PROD_FILE to tag ${TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add charts/values-prod.yaml
          git commit -m "chore: bump image tag to ${GITHUB_REF_NAME}" || exit 0
          git push
